
name: Construir DARK NEXUS TV

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          unzip -q DARK_NEXUS_TV_proyecto.zip -d proyecto
          sed -i '/android:banner/d' proyecto/app/src/main/AndroidManifest.xml

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Compilar APK
        run: gradle -p proyecto assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DARK-NEXUS-TV-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
